apiVersion: apps/v1
kind: Deployment
metadata:
  name: job-portal
spec:
  replicas: 1
  selector:
    matchLabels:
      app: job-portal
  template:
    metadata:
      labels:
        app: job-portal
    spec:
      containers:
        - name: job-portal
          image: ghandgevikas/job-portal:v1  # ✅ Your Docker Hub image
          ports:
            - containerPort: 3000
---
apiVersion: v1
kind: Service
metadata:
  name: job-portal-service
spec:
  type: NodePort
  selector:
    app: job-portal
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 32000  # Access via <NODE_IP>:32000

